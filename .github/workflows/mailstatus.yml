name: Bezorgstatus campagnemails

# Zet elk uur de Resend-status (bezorgd/bounce/klacht) van campagnemails in
# public.email_events, zodat het maildashboard "Bezorgd" klopt (scripts/mail/resend-status.mjs).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: mailstatus
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mail/resend-status.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
