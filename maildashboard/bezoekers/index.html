<title>Dashboard · Stekker of Diesel</title>
<script>
/* Het bezoekersdashboard is opgegaan in het ene dashboard. Oude links blijven werken. */
(function () {
  var m = /^#(mail|vid)=([\w-]+)/.exec(location.hash);
  location.replace('/maildashboard/' + (m ? (m[1] === 'mail' ? '#/ontvangers~c%3A' : '#/bezoekers~b%3A') + m[2] : '#/verkeer'));
})();
</script>
</head>
<body><a href="/maildashboard/">Naar het dashboard</a></body>
</html>
