<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Dashboard · Stekker of Diesel</title>
<link rel="preload" href="/assets/fonts/e2291e842cf5af.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/dash/dash.css?v=2">
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <div class="merk"><i></i>Stekker of Diesel</div>
    <label for="code">Toegangscode</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required>
    <button id="loginKnop" type="submit">Open dashboard</button>
    <div class="fout" id="loginFout"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <nav class="zij" id="zij"></nav>
  <div class="hoofd">
    <header class="balk">
      <button class="knop menuknop" id="menuKnop" type="button" aria-label="Menu">☰</button>
      <h1 id="titel"></h1>
      <span class="ruimte"></span>
      <div class="zoek"><input class="veld" id="zoek" type="search" placeholder="Zoek bedrijf, bezoeker of pagina" autocomplete="off" aria-label="Zoeken"><div class="res" id="zoekRes" hidden></div></div>
      <div class="seg" id="fWie" role="group" aria-label="Wie"><button data-v="echt" title="Zonder eigen bezoeken, bots en scanners">Echt</button><button data-v="intern" title="Eigen bezoeken en testmails">Intern</button><button data-v="bot" title="Bots, tests en mailscanners">Bots</button><button data-v="alles">Alles</button></div>
      <div class="pop"><button class="knop" id="perKnop" type="button"></button><div class="menu" id="perMenu" hidden></div></div>
      <button class="knop" id="ververs" type="button">Vernieuwen</button>
    </header>
    <main class="inhoud" id="inhoud"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="paneel" id="paneel" aria-label="Details">
  <header><span class="soort" id="paneelSoort"></span><span class="ruimte"></span><button class="knop mini" id="paneelTerug" type="button">← Terug</button><button class="x" id="paneelX" type="button" aria-label="Sluiten">×</button></header>
  <div class="lijf" id="paneelLijf"></div>
</aside>
<div class="tip" id="tip"></div>

<script src="/assets/dash/1-kern.js?v=2"></script>
<script src="/assets/dash/2-ui.js?v=2"></script>
<script src="/assets/dash/3-schermen.js?v=2"></script>
<script src="/assets/dash/4-schermen-mail.js?v=2"></script>
<script src="/assets/dash/5-paneel.js?v=2"></script>
<script src="/assets/dash/6-start.js?v=2"></script>
</body>
</html>
